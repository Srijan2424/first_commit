version: 1

backend:
  phases:
    build:
      commands:
        # npm ci currently rejects Amplify's bundled OpenTelemetry dependency
        # graph (npm/cli#9821). npm install resolves the same committed lockfile
        # while restoring the nested packages required by the Amplify toolchain.
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
        - MEDPAL_DEMO=true npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

frontend:
  phases:
    build:
      commands:
        - npm run build:demo
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
